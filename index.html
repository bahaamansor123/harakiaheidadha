<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة معايدة - جمعية حركية</title>
    <style>
        body { font-family: sans-serif; background-color: #f7f7f7; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 2; padding: 10px; border: 2px solid #ddd; border-radius: 8px; }
        button.generate-btn { padding: 10px 20px; background-color: #008080; color: white; border: none; border-radius: 8px; cursor: pointer; }
        canvas { max-width: 100%; height: auto; border-radius: 8px; }
        .download-btn { display: none; margin-top: 20px; padding: 15px 40px; background-color: #28a745; color: white; font-weight: bold; border-radius: 50px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

    <div class="container">
        <h2>اكتب اسم الموظف</h2>
        <div class="input-group">
            <input type="text" id="userName" placeholder="أدخل الاسم هنا...">
            <button class="generate-btn" onclick="drawName()">توليد البطاقة</button>
        </div>
        <canvas id="eidCanvas"></canvas>
        <br>
        <a id="downloadLink" download="eid-card.png" style="display:none;"><span class="download-btn">تحميل البطاقة</span></a>
    </div>

    <script>
        const canvas = document.getElementById('eidCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = 'eid.png'; 

        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
        };

        function drawName() {
            const name = document.getElementById('userName').value.trim();
            if (!name) { alert("يرجى إدخال الاسم"); return; }

            ctx.drawImage(img, 0, 0); // إعادة الرسم
            
            // تم تكبير الخط ليكون 80px بدلاً من 60px
            ctx.font = 'bold 80px Arial'; 
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            
            // تم ضبط الارتفاع ليكون 86% من طول الصورة (وهو مكان المربع الأخضر)
            const textY = canvas.height * 0.86; 
            
            ctx.fillText(name, canvas.width / 2, textY);

            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = canvas.toDataURL('image/png');
            downloadLink.style.display = 'inline-block';
        }
    </script>
</body>
</html>
