<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>معايدة عيد الأضحى</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.eid-image{
    width:100%;
    display:block;
}

.content{
    padding:30px 20px;
    text-align:center;
}

h1{
    font-size:22px;
    margin-bottom:10px;
    color:#000;
}

.sub-text{
    font-size:18px;
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid #ddd;
    font-size:18px;
    outline:none;
    margin-bottom:15px;
    font-family:'Cairo',sans-serif;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    font-family:'Cairo',sans-serif;
}

.show-btn{
    background:#118d6d;
    color:#fff;
}

.show-btn:hover{
    opacity:0.9;
}

.download-btn{
    background:#333;
    color:#fff;
    margin-top:10px;
}

.download-btn:hover{
    opacity:0.9;
}

.result-name{
    margin-top:25px;
    font-size:32px;
    color:#118d6d;
    font-weight:800;
}

.footer{
    margin-top:15px;
    color:#777;
    font-size:16px;
}

</style>
</head>

<body>

<div class="container">

    <!-- صورة المعايدة -->
    <img 
        id="eidImage"
        class="eid-image"
        src="eid.png"
        alt="Eid Mubarak"
    >

    <div class="content">

        <h1>معايدة عيد الأضحى</h1>

        <p class="sub-text">
            ✨ اكتب اسمك لتظهر المعايدة باسمك
        </p>

        <!-- إدخال الاسم -->
        <input 
            type="text"
            id="nameInput"
            placeholder="اكتب اسمك هنا"
        >

        <!-- زر عرض -->
        <button class="show-btn" onclick="showGreeting()">
            عرض المعايدة
        </button>

        <!-- زر تحميل -->
        <button class="download-btn" onclick="downloadImage()">
            تحميل المعايدة
        </button>

        <!-- الاسم -->
        <div class="result-name" id="resultName"></div>

        <div class="footer">
            ♡ كل عام وأنتم بخير
        </div>

    </div>

</div>

<script>

function showGreeting(){

    const name = document.getElementById("nameInput").value;

    document.getElementById("resultName").innerHTML = name;

}

function downloadImage(){

    const image = document.getElementById("eidImage").src;

    const link = document.createElement('a');

    link.href = image;

    link.download = 'eid-greeting.png';

    link.click();

}

</script>

</body>
</html>
