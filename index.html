<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد بطاقة معايدة عيد الأضحى - جمعية حركية</title>
    <style>
        :root {
            --primary-color: #008080; /* لون أخضر مقارب للبطاقة */
            --background-color: #f7f7f7;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        input {
            flex-grow: 2;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        button.generate-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            white-space: nowrap;
        }

        button.generate-btn:hover {
            background-color: #006666;
        }

        .card-preview {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }

        #downloadLink {
            display: none; /* مخفي بشكل افتراضي */
            margin-top: 25px;
            text-decoration: none;
        }

        .download-btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: #28a745; /* لون تحميل أخضر */
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .download-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        /* تنسيق للأجهزة الصغيرة */
        @media (max-width: 480px) {
            .input-group {
                flex-direction: column;
            }
            input {
                width: 100%;
            }
            button.generate-btn {
                width: 100%;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>اكتب اسمك لتحميل بطاقة المعايدة</h2>
        <p class="subtitle">عيد أضحى مبارك من جمعية حركية</p>
        
        <div class="input-group">
            <input type="text" id="userName" placeholder="أدخل اسم الموظف هنا">
            <button class="generate-btn" onclick="drawName()">توليد البطاقة</button>
        </div>

        <div class="card-preview">
            <canvas id="eidCanvas"></canvas>
        </div>

        <a id="downloadLink" download="eid-card.png">
            <span class="download-btn">تحميل بطاقة المعايدة</span>
        </a>
    </div>

    <script>
        const canvas = document.getElementById('eidCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const downloadLink = document.getElementById('downloadLink');

        // رابط الصورة الأصلية في مستودعك
        img.src = 'eid.png'; 

        // تأكد من تحميل الصورة بنجاح وتحديد حجم الكانفاس
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            drawInitialImage();
        };

        // رسم الصورة الأولية بدون اسم
        function drawInitialImage() {
            ctx.drawImage(img, 0, 0);
        }

        function drawName() {
            const name = document.getElementById('userName').value.trim();

            if (!name) {
                alert("يرجى إدخال اسمك أولاً.");
                return;
            }

            // إعادة رسم الصورة الأصلية لمسح الاسم السابق إن وجد
            drawInitialImage();

            // إعدادات النص (الاسم)
            // 1. اللون الأبيض
            ctx.fillStyle = 'white';
            // 2. المحاذاة للوسط
            ctx.textAlign = 'center';
            // 3. الخط (يمكنك زيادة حجم الخط إذا كان صغيراً جداً على الصورة الأصلية)
            ctx.font = 'bold 60px "Segoe UI", Tahoma, sans-serif'; 

            // تحديد إحداثيات الاسم - هنا الجزء الحرج
            // بناءً على تصميمك، الإحداثي الأفقي في الوسط.
            const textX = canvas.width / 2;
            // الإحداثي الرأسي: ليكون في "الخانة السفلية" (المنطقة المستطيلة تحت النص).
            // قد تحتاج لتعديل هذا الرقم البسيط (93%) ليكون دقيقاً تماماً فوق الخانة.
            const textY = canvas.height * 0.93; 

            // رسم الاسم على الكانفاس
            ctx.fillText(name, textX, textY);

            // تحضير رابط التحميل وإظهار الزر
            const dataURL = canvas.toDataURL('image/png');
            downloadLink.href = dataURL;
            downloadLink.style.display = 'block'; // إظهار زر التحميل
        }
    </script>
</body>
</html>
