<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>معايدة عيد الأضحى</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Tahoma,sans-serif;
    }

    body{
      background:#f3f3f3;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:500px;
      background:#fff;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.1);
    }

    .card{
      position:relative;
      width:100%;
    }

    .card img{
      width:100%;
      display:block;
    }

    #namePreview{
      position:absolute;
      bottom:80px;
      left:50%;
      transform:translateX(-50%);
      color:white;
      font-size:34px;
      font-weight:bold;
      text-shadow:0 4px 10px rgba(0,0,0,.5);
      width:100%;
      text-align:center;
      padding:0 20px;
    }

    .content{
      padding:20px;
    }

    h1{
      font-size:24px;
      margin-bottom:10px;
      text-align:center;
    }

    p{
      color:#666;
      text-align:center;
      margin-bottom:20px;
      line-height:1.7;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid #ddd;
      font-size:16px;
      margin-bottom:15px;
      outline:none;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:#0f8b6d;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      opacity:.9;
    }

    .footer{
      text-align:center;
      font-size:13px;
      color:#888;
      margin-top:15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">
      <!-- ضع اسم صورة المعايدة هنا -->
      <img src="eid.png" alt="Eid Mubarak">

      <div id="namePreview">
        اسمك هنا
      </div>
    </div>

    <div class="content">

      <h1>معايدة عيد الأضحى</h1>

      <p>
        اكتب اسمك لتظهر المعايدة باسمك ✨
      </p>

      <input
        type="text"
        id="nameInput"
        placeholder="اكتب اسمك هنا"
      >

      <button onclick="updateName()">
        عرض المعايدة
      </button>

      <div class="footer">
        كل عام وأنتم بخير 🤍
      </div>

    </div>

  </div>

  <script>
    function updateName(){
      let name = document.getElementById("nameInput").value;

      if(name.trim() === ""){
        name = "اسمك هنا";
      }

      document.getElementById("namePreview").innerText = name;
    }

    // قراءة الاسم من الرابط تلقائيًا
    const params = new URLSearchParams(window.location.search);
    const urlName = params.get("name");

    if(urlName){
      document.getElementById("namePreview").innerText = urlName;
      document.getElementById("nameInput").value = urlName;
    }
  </script>

</body>
</html>
