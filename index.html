<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بطاقة معايدة</title>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; }
        canvas { max-width: 100%; height: auto; border: 1px solid #ccc; margin-top: 20px; }
        input { padding: 10px; font-size: 16px; margin: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>اكتب اسمك لتحميل بطاقة المعايدة</h2>
    <input type="text" id="userName" placeholder="أدخل اسم الموظف هنا">
    <button onclick="drawName()">توليد البطاقة</button>
    <br>
    <canvas id="eidCanvas"></canvas>

    <script>
        const canvas = document.getElementById('eidCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = 'eid.png'; // تأكد أن اسم الصورة يطابق ملفك تماماً

        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
        };

        function drawName() {
            ctx.drawImage(img, 0, 0);
            ctx.font = 'bold 50px Arial';
            ctx.fillStyle = 'black';
            ctx.textAlign = 'center';
            const name = document.getElementById('userName').value;
            ctx.fillText(name, canvas.width / 2, canvas.height / 2); // يمكنك تعديل الإحداثيات لتناسب مكان النص في تصميمك
        }
    </script>
</body>
</html>
